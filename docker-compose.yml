services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - uploads:/app/uploads
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-videos}
      DB_USER: ${DB_USER:-video_user}
      DB_PASSWORD: ${DB_PASSWORD:-video_pass}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
      UPLOADS_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-videos}
      POSTGRES_USER: ${DB_USER:-video_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-video_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-video_user} -d ${DB_NAME:-videos}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads:
