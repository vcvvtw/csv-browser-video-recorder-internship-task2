<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /app

    WSGIDaemonProcess videos user=www-data group=www-data threads=5 python-path=/app
    WSGIProcessGroup videos
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /app/web_service.wsgi
    WSGIPassAuthorization On

    Alias /media /app/uploads
    <Directory /app/uploads>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        AddType video/webm .webm
        AddType video/mp4 .mp4
    </Directory>

    <Directory /app>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <Files web_service.wsgi>
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
